services:
  home-monitor:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      INTERVAL_MS: "15000"
    volumes:
      - ./targets.json:/config/targets.json:ro
    ports:
      - "127.0.0.1:8090:8090"
