name: Production images

on:
  pull_request:
  push:
    branches: [feature/fast-live-stats]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.image.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image:
          - name: speedtest-tracker
            context: .
            file: network-monitor/Dockerfile.app
          - name: speedtest-tracker-collector
            context: network-monitor
            file: network-monitor/Dockerfile.collector
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: names
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image.name }}
        run: echo "repository=ghcr.io/${OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: speedtest-verification:local
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch }}
      - name: Smoke test application
        if: matrix.image.name == 'speedtest-tracker'
        shell: bash
        run: bash deploy/smoke-app.sh speedtest-verification:local
      - name: Smoke test collector
        if: matrix.image.name == 'speedtest-tracker-collector'
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --read-only \
            --entrypoint sh speedtest-verification:local -ec 'ip -j neigh show dev lo; python3 -c "import collector, transport"'
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/fast-live-stats'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested platform
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/fast-live-stats'
        env:
          IMAGE: ${{ steps.names.outputs.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          target="$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker tag speedtest-verification:local "$target"
          docker push "$target"

  manifest:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/fast-live-stats'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          for image in speedtest-tracker speedtest-tracker-collector; do
            repository="ghcr.io/${OWNER,,}/$image"
            docker buildx imagetools create \
              -t "$repository:sha-$GITHUB_SHA" -t "$repository:fast-live-stats" \
              "$repository:sha-$GITHUB_SHA-amd64" "$repository:sha-$GITHUB_SHA-arm64"
            docker buildx imagetools inspect "$repository:sha-$GITHUB_SHA"
          done

  agent-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s network-monitor -p test_agent_windows.py
